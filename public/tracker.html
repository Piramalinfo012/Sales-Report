<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Auto Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col p-5">

    <div class="max-w-md w-full mx-auto flex-1 flex flex-col mt-4">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/30">
                <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white mb-1">Live Auto Tracker</h1>
            <p class="text-xs text-slate-400">Keep this page open to automatically sync location</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-6">
            <div class="mb-4">
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Device / Mobile Number</label>
                <input type="number" id="mobileNumber" placeholder="Enter your 10-digit number" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500 transition-colors" />
            </div>

            <div class="mb-5">
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Update Interval</label>
                <select id="intervalMins" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-emerald-500 appearance-none">
                    <option value="1">Every 1 Minute (Testing)</option>
                    <option value="5">Every 5 Minutes</option>
                    <option value="15" selected>Every 15 Minutes</option>
                    <option value="30">Every 30 Minutes</option>
                    <option value="60">Every 1 Hour</option>
                </select>
            </div>

            <button id="startBtn" onclick="toggleTracking()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
                <svg id="playIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="btnText">Start Tracking</span>
            </button>
        </div>

        <!-- Warning Panel -->
        <div id="warningPanel" class="bg-amber-950/40 border border-amber-900/50 rounded-xl p-4 mb-6 hidden">
            <p class="text-[11px] text-amber-200/80 leading-relaxed text-center font-medium">
                ⚠️ <strong class="text-amber-400">Important:</strong> Do not close this browser tab. You can minimize the browser, but background tracking works best if you leave the screen on (you can lower brightness to save battery).
            </p>
        </div>

        <div class="flex-1 min-h-[150px] bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col">
            <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sync Log</h3>
                <span id="statusBadge" class="px-2 py-0.5 rounded-md bg-slate-800 text-[10px] font-bold text-slate-500">OFFLINE</span>
            </div>
            <div id="logs" class="flex-1 overflow-y-auto space-y-2 max-h-[250px]">
                <p class="text-[11px] text-slate-600 text-center py-4">No data sent yet.</p>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhXWGagj_RY-JEkrNaKA2aNjiSlAOJDEYau6Hm7tCfQ4t7Y03aGZBhgkPWfJrslFrdZg/exec';
        let isTracking = false;
        let trackingIntervalId = null;

        function addLog(msg, type = 'info') {
            const logsDiv = document.getElementById('logs');
            if (logsDiv.innerHTML.includes('No data sent yet')) logsDiv.innerHTML = '';
            
            const time = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            let color = 'text-slate-300';
            if (type === 'success') color = 'text-emerald-400';
            if (type === 'error') color = 'text-red-400';
            if (type === 'warn') color = 'text-amber-400';

            const logEl = document.createElement('div');
            logEl.className = `text-[11px] ${color} flex items-start gap-2 border-l-2 border-slate-800 pl-2 py-1`;
            logEl.innerHTML = `<span class="text-slate-500 whitespace-nowrap">[${time}]</span> <span class="leading-relaxed">${msg}</span>`;
            logsDiv.prepend(logEl);
        }

        async function syncLocation() {
            const number = document.getElementById('mobileNumber').value.trim();
            if (!number) return;

            addLog('Requesting GPS location...', 'info');

            if (!navigator.geolocation) {
                addLog('GPS not supported on this browser.', 'error');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const acc = position.coords.accuracy;
                    addLog(`Got location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`, 'info');

                    // Format Date for Excel: DD-MM-YYYY HH:mm:ss
                    const now = new Date();
                    const d = String(now.getDate()).padStart(2, '0');
                    const m = String(now.getMonth() + 1).padStart(2, '0');
                    const y = now.getFullYear();
                    const time = now.toLocaleTimeString('en-US', { hour12: false }); // 24hr format
                    const dateStr = `${d}-${m}-${y} ${time}`;

                    // Row structure for "GPS" sheet:
                    // A: Transporter, B: Recipient, C: Vehicle, D: Resource, E: Device, F: Date, G: Address, H: Lat, I: Lng, J: Accuracy
                    const rowData = [
                        '', // Transporter
                        '', // Recipient
                        '', // Vehicle
                        number, // Resource Name
                        number, // Device Number
                        dateStr, // Result Date
                        'Auto Tracked via App', // Address
                        lat, 
                        lng, 
                        acc
                    ];

                    try {
                        const params = new URLSearchParams();
                        params.append('sheetName', 'GPS');
                        params.append('action', 'insert');
                        params.append('rowData', JSON.stringify(rowData));

                        addLog('Syncing to Google Sheets...', 'info');
                        const res = await fetch(APPS_SCRIPT_URL, {
                            method: 'POST',
                            body: params,
                        });
                        const data = await res.json();
                        
                        if (data.success) {
                            addLog('Successfully saved to GPS sheet!', 'success');
                        } else {
                            addLog('Failed to save to sheet.', 'error');
                        }
                    } catch (err) {
                        addLog('Network error while syncing.', 'error');
                        console.error(err);
                    }
                },
                (error) => {
                    let errStr = 'Unknown GPS Error';
                    if (error.code === 1) errStr = 'Permission Denied. Please allow location access.';
                    if (error.code === 2) errStr = 'Position Unavailable. Turn on GPS.';
                    if (error.code === 3) errStr = 'Timeout getting location.';
                    addLog(errStr, 'error');
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        }

        function toggleTracking() {
            const number = document.getElementById('mobileNumber').value.trim();
            if (!number) {
                alert('Please enter your Mobile/Device Number first.');
                return;
            }

            const btn = document.getElementById('startBtn');
            const btnText = document.getElementById('btnText');
            const statusBadge = document.getElementById('statusBadge');
            const numInput = document.getElementById('mobileNumber');
            const intInput = document.getElementById('intervalMins');
            const warnPanel = document.getElementById('warningPanel');

            if (isTracking) {
                // STOP TRACKING
                isTracking = false;
                clearInterval(trackingIntervalId);
                
                btn.className = "w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2";
                btnText.innerText = "Start Tracking";
                document.getElementById('playIcon').outerHTML = `<svg id="playIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                
                statusBadge.className = "px-2 py-0.5 rounded-md bg-slate-800 text-[10px] font-bold text-slate-500";
                statusBadge.innerText = "OFFLINE";
                
                numInput.disabled = false;
                intInput.disabled = false;
                warnPanel.classList.add('hidden');
                
                addLog('Tracking stopped.', 'warn');
            } else {
                // START TRACKING
                // Request initial permission immediately
                if(navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}, {enableHighAccuracy: true});
                }

                isTracking = true;
                const mins = parseInt(intInput.value) || 15;
                
                btn.className = "w-full py-3.5 rounded-xl bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-400 hover:to-red-500 text-white font-bold text-sm shadow-lg shadow-rose-500/20 transition-all flex items-center justify-center gap-2";
                btnText.innerText = "Stop Tracking";
                document.getElementById('playIcon').outerHTML = `<svg id="playIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>`;

                statusBadge.className = "px-2 py-0.5 rounded-md bg-emerald-500/20 text-[10px] font-bold text-emerald-400 animate-pulse border border-emerald-500/30";
                statusBadge.innerText = "TRACKING ACTIVE";

                numInput.disabled = true;
                intInput.disabled = true;
                warnPanel.classList.remove('hidden');

                addLog(`Started auto-tracking every ${mins} minute(s).`, 'success');
                
                // Trigger first sync immediately
                syncLocation();

                // Set interval
                trackingIntervalId = setInterval(() => {
                    syncLocation();
                }, mins * 60 * 1000);
            }
        }
    </script>
</body>
</html>
